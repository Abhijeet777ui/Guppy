name: CI

on:
  push:
    branches: [main, feature/nexus]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        shell: bash
        run: |
          pnpm test > /tmp/test.log 2>&1; exit_code=$?
          if [ $exit_code -ne 0 ]; then
            { grep -aE "ERR_PNPM|FAIL |AssertionError|✗|×|Error:" /tmp/test.log || tail -n 8 /tmp/test.log; } | head -n 8 | while IFS= read -r line; do
              [ -z "$line" ] && continue
              echo "::error file=docs/STATUS.md,line=1::${line}"
            done
          fi
          exit $exit_code
